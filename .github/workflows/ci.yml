name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      # X-4: perf-smoke на синтетике (PerfSmokeTest) — отчёт в сводку job и артефактом
      - name: Publish perf-smoke report
        if: always()
        run: |
          if [ -f target/perf-smoke/report.md ]; then
            cat target/perf-smoke/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload perf-smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke
          path: target/perf-smoke/
          if-no-files-found: ignore

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: star-guard-core-jar
          path: target/star-guard-core-*.jar
          if-no-files-found: error

  extension:
    name: Extension and Action (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test GitHub Action
        run: node --test action/test/*.test.js

      - name: Test extension DOM contract
        run: node --test extension/test/*.test.js

      - name: Check extension sources
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"
          for file in extension/src/*.js extension/preview/*.js; do node --check "$file"; done

      - name: Pack extension
        run: cd extension && zip -r ../star-guard-extension.zip . -x 'preview/*' 'test/*'

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: star-guard-extension
          path: star-guard-extension.zip
          if-no-files-found: error
