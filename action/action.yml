name: Star Guard — проверка зависимостей
description: >
  Находит зависимости, которые добавляет pull request (package.json, requirements*.txt),
  ищет их репозитории на GitHub и пишет в PR комментарий с оценкой Star Guard —
  есть ли у них признаки накрученных звёзд.
author: StarChecker
branding:
  icon: shield
  color: green
inputs:
  api-url:
    description: Адрес сервера Star Guard, доступный из раннера (например, https://star-guard.example.com)
    required: true
  github-token:
    description: Токен для чтения файлов PR и комментариев
    required: false
    default: ${{ github.token }}
  hours:
    description: Окно анализа в часах
    required: false
    default: "6"
  fail-on:
    description: "Уровень, начиная с которого job падает: none | medium | high | critical"
    required: false
    default: none
  comment:
    description: Писать ли комментарий в PR (true/false)
    required: false
    default: "true"
outputs:
  flagged:
    description: Число новых зависимостей с уровнем не ниже medium
  checked:
    description: Число новых зависимостей, найденных на GitHub
runs:
  using: node20
  main: index.js
