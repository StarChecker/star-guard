services:
  star-guard:
    build: .
    image: star-guard:local
    ports:
      - "${STAR_GUARD_PORT:-8080}:8080"
    environment:
      APP_ARCHIVE_MODE: "${APP_ARCHIVE_MODE:-fixture}"
      APP_SCORING_MODE: "${APP_SCORING_MODE:-mock}"
      # токен GitHub: анализ любого репозитория по истории и возраст аккаунтов (C2)
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      APP_GITHUB_ENABLED: "${APP_GITHUB_ENABLED:-false}"
    restart: unless-stopped
