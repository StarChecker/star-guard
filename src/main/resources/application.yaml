server:
  port: 8080

spring:
  application:
    name: star-guard-core
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    openfeign:
      client:
        config:
          ghArchive:
            connect-timeout: 5000
            read-timeout: 30000
            logger-level: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  archive:
    base-url: https://data.gharchive.org
    mode: http                # http | fixture
    default-window-hours: 6
    max-window-hours: 24
    lag-hours: 2              # GH Archive публикует дампы с задержкой
    parallelism: 4
    retries: 1                # только IO/5xx; 404 = отсутствующий час
    fail-fast: false          # пропускать недоступные часы, отмечая их в ответе
    cache-ttl: 1h
    fixture-location: "classpath:fixtures/gharchive/*.jsonl"
    star-index:               # глобальный индекс звёзд всех репозиториев окна (для C4)
      enabled: true
      max-pairs-per-hour: 500000  # лимит пар (репозиторий, актор) на часовой дамп — bounded memory
      cache-hours: 48
  scoring:
    mode: mock                # mock | real — общий переключатель реализаций C1–C5
    mock-mode: healthy        # профиль моков: healthy | borderline | suspicious (только для mock-проверок)
    min-confidence: 0.5
    weights:
      burst: 0.30
      fresh_accounts: 0.22
      engagement: 0.18
      actor_overlap: 0.22
      circadian: 0.08
    amplification:
      multi-trigger:
        min-checks: 2
        check-score-at-least: 0.7
        floor: 60
      strong-check:
        check-ids: [burst, fresh_accounts, actor_overlap]
        check-score-at-least: 0.85
        min-confidence: 0.7
        floor: 70
    levels:
      medium: 30
      high: 60
      critical: 85
    checks:
      engagement:                         # C3 «Дисбаланс звёзды/активность»
        mode: ${app.scoring.mode:mock}    # mock | real; можно переопределить точечно
        engagement-threshold: 0.2         # engagement >= порога → вклад C3 = 0
        stars-gate: 20                    # gate = min(1, stars / stars-gate)
        min-stars-for-confidence: 5       # меньше звёзд → confidence 0, C3 вне score
        confidence: 0.9
      actor-overlap:                      # C4 «Пересечение акторов»
        mode: ${app.scoring.mode:mock}    # mock | real; можно переопределить точечно
        candidate-pool: 500               # сколько репозиториев с общими акторами сравнивать по Jaccard
        jaccard-floor: 0.05               # Jmax <= floor → вклад Jaccard = 0
        jaccard-span: 0.45                # Jmax >= floor + span → вклад Jaccard = 1
        jaccard-weight: 0.5               # s4 = w·sJaccard + (1 − w)·sMulti
        multi-repo-threshold: 3           # актор поставил звёзды >= 3 репозиториям за окно (с текущим)
        multi-floor: 0.1
        multi-span: 0.4
        actors-gate: 10                   # gate = min(1, |A_r| / actors-gate)
        min-actors-for-confidence: 5      # меньше акторов → confidence 0, C4 вне score
        confidence: 0.8                   # × доля окна, покрытая индексом
        truncated-penalty: 0.75           # × confidence, если индекс обрезан лимитом памяти
        top-overlaps: 3                   # сколько пересекающихся репозиториев показать в explain
