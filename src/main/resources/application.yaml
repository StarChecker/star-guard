server:
  port: 8080

spring:
  config:
    import: classpath:scoring.yaml
  application:
    name: star-guard-core
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    openfeign:
      client:
        config:
          ghArchive:
            connect-timeout: 5000
            read-timeout: 30000
            logger-level: basic
          githubApi:
            connect-timeout: 3000
            read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  archive:
    base-url: https://data.gharchive.org
    mode: http                # http | fixture
    default-window-hours: 6
    max-window-hours: 24
    lag-hours: 2              # GH Archive публикует дампы с задержкой
    parallelism: 4
    retries: 1                # только IO/5xx; 404 = отсутствующий час
    fail-fast: false          # пропускать недоступные часы, отмечая их в ответе
    cache-ttl: 1h
    fixture-location: "classpath:fixtures/gharchive/*.jsonl"
    star-index:               # глобальный индекс звёзд всех репозиториев окна (для C4)
      enabled: true
      max-pairs-per-hour: 500000  # лимит пар (репозиторий, актор) на часовой дамп — bounded memory
      cache-hours: 48
  index:
    enabled: true             # false — вернуться к прямому сканированию GH Archive
    top-n: 1000               # сколько репозиториев попадает в индекс по звёздам за окно
    window-hours: 6           # окно индекса; hours в запросе не может его превышать
    build-on-startup: true    # фоновый прогрев; до готовности API отвечает 503 INDEX_NOT_READY
    refresh-cron: "0 10 * * * *"   # UTC, после задержки публикации GH Archive
  github:
    enabled: false
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    top-n: 100
    max-lookups-per-request: 50
    cache-ttl: 24h
    cache-max-size: 100000
    rate-limit-pause: 1m
    history:                  # анализ любого репозитория по истории GitHub (нужен GITHUB_TOKEN)
      max-days: 30            # глубина истории
      max-stars: 3000         # сколько последних звёзд загружать (по 100 за запрос GraphQL)
      existence-check: true   # скрывать из /api/v1/index/repos удалённые на GitHub репозитории
      existence-ttl: 6h
  scoring:
    mode: mock                # mock | real — общий переключатель реализаций C1–C5
    mock-mode: healthy        # профиль моков: healthy | borderline | suspicious (только для mock-проверок)
    min-confidence: 0.5
    weights:
      burst: ${app.scoring.checks.burst.weight}
      fresh_accounts: 0.22
      engagement: 0.18
      actor_overlap: 0.22
      circadian: 0.08
    amplification:
      multi-trigger:
        min-checks: 2
        check-score-at-least: 0.7
        floor: 60
      strong-check:
        check-ids: [burst, fresh_accounts, actor_overlap]
        check-score-at-least: 0.85
        min-confidence: 0.7
        floor: 70
    levels:
      medium: 30
      high: 60
      critical: 85
    checks:
      fresh-accounts:                     # C2 "Свежие и пустые аккаунты"
        mode: ${app.scoring.mode:mock}    # mock | real; можно переопределить точечно
        new-account-days: 30              # аккаунт моложе - свежий
        empty-actor-days: 90              # нет событий, кроме звёзд, за этот срок - пустой
        share-floor: 0.3                  # доля свежих <= 0.3 -> s2 = 0
        share-span: 0.6                   # доля свежих >= 0.3 + 0.6 -> s2 = 1
        min-actors: 10                    # gate = min(1, акторов со звездой / min-actors)
        confidence: 0.9                   # умножается на долю акторов, о которых есть данные
        sample-hashes: 5                  # сколько хэшей свежих акторов показать в details
      engagement:                         # C3 «Дисбаланс звёзды/активность»
        mode: ${app.scoring.mode:mock}    # mock | real; можно переопределить точечно
        engagement-threshold: 0.2         # engagement >= порога → вклад C3 = 0
        stars-gate: 20                    # gate = min(1, stars / stars-gate)
        min-stars-for-confidence: 5       # меньше звёзд → confidence 0, C3 вне score
        confidence: 0.9
      actor-overlap:                      # C4 «Пересечение акторов»
        mode: ${app.scoring.mode:mock}    # mock | real; можно переопределить точечно
        candidate-pool: 500               # сколько репозиториев с общими акторами сравнивать по Jaccard
        jaccard-floor: 0.05               # Jmax <= floor → вклад Jaccard = 0
        jaccard-span: 0.45                # Jmax >= floor + span → вклад Jaccard = 1
        jaccard-weight: 0.5               # s4 = w·sJaccard + (1 − w)·sMulti
        multi-repo-threshold: 3           # актор поставил звёзды >= 3 репозиториям за окно (с текущим)
        multi-floor: 0.1
        multi-span: 0.4
        actors-gate: 10                   # gate = min(1, |A_r| / actors-gate)
        min-actors-for-confidence: 5      # меньше акторов → confidence 0, C4 вне score
        confidence: 0.8                   # × доля окна, покрытая индексом
        truncated-penalty: 0.75           # × confidence, если индекс обрезан лимитом памяти
        top-overlaps: 3                   # сколько пересекающихся репозиториев показать в explain
        suspicious-jaccard: 0.25          # звёзды общих акторов с репозиториями J >= порога — подозрительные на таймлайне
